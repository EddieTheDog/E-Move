<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Front Desk - E-Move</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>
<body>
<header><h1>Front Desk - Create Package</h1></header>
<main>
<form id="packageForm">
  <label>Name:</label>
  <input type="text" id="customerName" required>
  <label>Email:</label>
  <input type="text" id="customerEmail">
  <label>Room:</label>
  <input type="text" id="room">
  <label>Priority:</label>
  <select id="priority">
    <option value="normal">Normal</option>
    <option value="high">High</option>
  </select>
  <label>Flagged (illegal items):</label>
  <select id="flagged">
    <option value="false">No</option>
    <option value="true">Yes</option>
  </select>
  <button type="button" onclick="createPackage()">Generate Package</button>
</form>

<h3>Package Barcode:</h3>
<canvas id="barcode"></canvas>

<h3>Customer QR Code:</h3>
<canvas id="qrcode"></canvas>

<script src="js/frontdesk.js"></script>
</main>
</body>
</html>
