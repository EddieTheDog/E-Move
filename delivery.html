<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E-Move Delivery</title>
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Barcode JS -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <!-- QR Code JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <header>
    <h1>E-Move Delivery</h1>
  </header>

  <main>
    <h2>Scan Package</h2>
    <label>Enter Tracking Number:</label>
    <input type="text" id="scan-input" placeholder="TRK-EM1234">
    <button id="scan-btn">Scan</button>

    <div id="package-info" style="display:none;">
      <p>Package Number: <span id="package-number"></span></p>
      <p>Tracking Number: <span id="tracking-number"></span></p>
      <p>Shelf: <span id="shelf"></span></p>
      <p>Status: <span id="status"></span></p>

      <h3>Barcode:</h3>
      <svg id="barcode"></svg>

      <h3>QR Code:</h3>
      <div id="qrcode"></div>

      <button id="go-back">Go Back</button>
    </div>
  </main>

  <script src="js/delivery.js"></script>
</body>
</html>
