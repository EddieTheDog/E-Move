<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delivery - E-Move</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <h1>Delivery</h1>
    <button onclick="window.location.href='index.html'">Go Back</button>
  </header>
  <main>
    <label>Scan / Enter Tracking Number:</label>
    <input type="text" id="scan-input" placeholder="TRK-EM1234">
    <button id="scan-btn">Scan</button>

    <div id="package-info" style="display:none; margin-top:15px;">
      <p>Package #: <span id="package-number"></span></p>
      <p>Tracking #: <span id="tracking-number"></span></p>
      <p>Shelf: <span id="shelf"></span></p>
      <p>Status: <span id="status"></span></p>
    </div>
  </main>
  <script src="js/delivery.js"></script>
</body>
</html>
