<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - E-Move</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <h1>Admin Dashboard</h1>
    <button onclick="window.location.href='index.html'">Go Back</button>
  </header>
  <main>
    <h2>All Packages</h2>
    <table border="1">
      <thead>
        <tr>
          <th>Package #</th>
          <th>Tracking #</th>
          <th>Customer</th>
          <th>Shelf</th>
          <th>Status</th>
          <th>Priority</th>
          <th>Location</th>
        </tr>
      </thead>
      <tbody id="admin-list"></tbody>
    </table>

    <h3>Remove Package</h3>
    <input type="text" id="remove-input" placeholder="Tracking Number">
    <button id="remove-btn">Remove Package</button>
    <button id="clear-btn">Remove All Packages</button>
  </main>
  <script src="js/admin.js"></script>
</body>
</html>
