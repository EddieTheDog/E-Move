<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Warehouse - E-Move</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
#shelf-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
}
.shelf-card {
    border: 2px solid #ccc;
    border-radius: 8px;
    padding: 10px;
    width: 220px;
    background-color: #fff;
}
.package-card {
    border: 1px solid #aaa;
    border-radius: 6px;
    padding: 5px;
    margin: 5px 0;
    cursor: pointer;
    transition: transform 0.1s;
}
.package-card:hover { transform: translateY(-2px); }
.package-priority { background-color: #ffcccc; }
.package-flagged { border: 2px solid red; }

/* Tasks list */
.task-card {
    border: 2px solid #0077cc;
    border-radius: 8px;
    padding: 10px;
    margin: 10px 0;
    cursor: pointer;
    background-color: #eef;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.task-card.priority { border-color: red; background-color: #ffdada; }
.notification { width: 12px; height: 12px; background: red; border-radius: 50%; display: inline-block; margin-left: 5px; }

/* Fullscreen modal */
.modal {
    display: none;
    position: fixed;
    top:0; left:0; width:100%; height:100%;
    background-color: rgba(0,0,0,0.8);
    justify-content: center; align-items: center;
    z-index: 1000;
}
.modal-content {
    background-color: #fff;
    padding: 20px;
    border-radius: 10px;
    width: 400px;
    max-width: 90%;
}
.modal-content input[type="text"] { width: 100%; margin-top: 10px; padding: 8px; }
.modal-content label { display: block; margin: 5px 0; }
.modal-content button { margin-top: 10px; }

#legend { margin-top: 15px; }
.legend-item { display: inline-block; padding: 5px 10px; border-radius: 4px; margin-right: 10px; font-weight: bold; }
.legend-priority { background-color: #ffcccc; }
.legend-flagged { border: 2px solid red; padding: 5px 8px; }
.legend-normal { background-color: #fff; border:1px solid #ccc; }
</style>
</head>
<body>
<header><h1>Warehouse Dashboard</h1></header>

<main>
<div style="margin-bottom:10px;">
  <button onclick="showTab('shelves')">Shelf Overview</button>
  <button onclick="showTab('tasks')">Tasks</button>
</div>

<!-- Shelf Overview -->
<div id="shelvesTab">
  <h2>Shelves</h2>
  <div id="shelf-grid"></div>
  <div id="legend">
    <span class="legend-item legend-priority">Priority (Red)</span>
    <span class="legend-item legend-flagged">Flagged (Border)</span>
    <span class="legend-item legend-normal">Normal</span>
  </div>
</div>

<!-- Tasks -->
<div id="tasksTab" style="display:none;">
  <h2>Warehouse Tasks</h2>
  <div id="task-list"></div>
</div>

<!-- Fullscreen modal for tasks -->
<div id="taskModal" class="modal">
  <div class="modal-content">
    <h3 id="modal-title"></h3>
    <p id="modal-description"></p>
    <input type="text" id="modal-scan" placeholder="Scan barcode">
    <label><input type="checkbox" id="reviewCheckbox"> Reviewed with me</label>
    <label><input type="checkbox" id="damageCheckbox"> Damaged?</label>
    <label><input type="checkbox" id="onWayCheckbox"> On the way to delivery bay</label>
    <label><input type="checkbox" id="atBayCheckbox"> Arrived at delivery bay</label>
    <button onclick="completeModalTask()">Confirm</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script src="js/warehouse.js"></script>
</main>
</body>
</html>
